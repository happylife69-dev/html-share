<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="공유 HTML 문서">
  <title>공유 문서</title>
  <style>
    :root { color-scheme: light; }
    body { max-width: 760px; margin: 0 auto; padding: 3rem 1.5rem; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #1f2937; line-height: 1.7; }
    h1 { color: #1d4ed8; }
    .notice { padding: 1rem 1.25rem; border-radius: .6rem; background: #eff6ff; border-left: 4px solid #2563eb; }
    code { background: #f3f4f6; padding: .12rem .35rem; border-radius: .25rem; }
  </style>
</head>
<body>
  <main>
    <h1>공유 문서</h1>
    <p class="notice">이 웹사이트는 GitHub Pages로 자동 배포됩니다.</p>
    <h2>사용 방법</h2>
    <ol>
      <li><code>index.html</code>을 수정합니다.</li>
      <li>변경 사항을 GitHub에 올리면 공개 주소가 자동으로 갱신됩니다.</li>
    </ol>
  </main>
</body>
</html>
